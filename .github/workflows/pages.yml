name: Deploy Aither Maps to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  GOOGLE_MAPS_SECRET_NAME: GOOGLE_MAPS_DEMO_API_KEY

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Load Google Maps secret
        env:
          REPO_MAPS_KEY: ${{ secrets.GOOGLE_MAPS_DEMO_API_KEY }}
          ENV_MAPS_KEY: ${{ secrets.GOOGLE_MAPS_DEMO_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          KEY="${REPO_MAPS_KEY:-}"
          if [[ -z "$KEY" ]]; then KEY="${ENV_MAPS_KEY:-}"; fi
          if [[ -z "$KEY" ]]; then
            echo "ERROR: GOOGLE_MAPS_DEMO_API_KEY is unavailable to this workflow."
            echo "Checked repository/environment secret named GOOGLE_MAPS_DEMO_API_KEY."
            exit 1
          fi
          {
            echo "GOOGLE_MAPS_DEMO_API_KEY<<__AITHER_MAPS_KEY__"
            printf '%s\n' "$KEY"
            echo "__AITHER_MAPS_KEY__"
          } >> "$GITHUB_ENV"

      - name: Generate runtime Maps configuration
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const key = process.env.GOOGLE_MAPS_DEMO_API_KEY;
          if (!key) throw new Error('Google Maps API key is missing.');
          const config = `// Generated during GitHub Pages deployment. Do not edit.\nwindow.AITHER_MAPS_DEMO_KEY = ${JSON.stringify(key)};\n`;
          fs.writeFileSync('maps-config.js', config, { encoding: 'utf8' });
          NODE

      - name: Verify generated configuration without exposing the key
        shell: bash
        run: |
          set -euo pipefail
          test -s maps-config.js
          grep -q 'window.AITHER_MAPS_DEMO_KEY' maps-config.js
          echo "Runtime Maps configuration generated successfully."

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
